services:
  - type: web
    name: kazilink-tanzania
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kazilink-postgres
          property: connectionString

databases:
  - name: kazilink-postgres
    databaseName: kazilink
    user: kazilink
    plan: free
